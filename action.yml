name: ai-admissibility-action
description: Public evaluation gate for AI Admissibility; synthetic smoke only until runtime authority integration is wired.
author: Pin Floyd

branding:
  icon: shield
  color: purple

inputs:
  authority-url:
    description: External authority endpoint URL used as evaluation context.
    required: false
  authority-pubkey:
    description: Pinned authority public key or digest used as evaluation context.
    required: false
  policy-id:
    description: Policy identifier.
    required: false
  trust-verdict:
    description: Runtime trust verdict. Must be PASS.
    required: false
  proof-access-id:
    description: Deprecated compatibility input for older examples. The current public site does not issue Proof Access IDs.
    required: false
  pilot-smoke-only:
    description: Synthetic evaluation mode only. Not production access and not a live authority call.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate deprecated compatibility input when supplied
      shell: bash
      run: |
        set -euo pipefail
        PROOF_ACCESS_ID='${{ inputs.proof-access-id }}'
        if [ -n "$PROOF_ACCESS_ID" ]; then
          case "$PROOF_ACCESS_ID" in
            REPLACE_WITH_PROOF_ACCESS_ID|example-proof-access-id|proof-access-id|YOUR_PROOF_ACCESS_ID|placeholder|TODO)
              echo "FAIL_CLOSED: proof-access-id placeholder is not allowed"
              exit 1
              ;;
          esac
          echo "NOTICE: proof-access-id is a deprecated compatibility input and is not a current credential."
        fi

    - name: Preflight gate
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $authorityUrl = '${{ inputs.authority-url }}'
        $authorityPubkey = '${{ inputs.authority-pubkey }}'
        $policyId = '${{ inputs.policy-id }}'
        $trustVerdict = '${{ inputs.trust-verdict }}'
        $pilotSmokeOnly = '${{ inputs.pilot-smoke-only }}'

        if ([string]::IsNullOrWhiteSpace($authorityUrl)) {
          Write-Error "FAIL_CLOSED: authority-url is missing"
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($authorityPubkey)) {
          Write-Error "FAIL_CLOSED: authority-pubkey is missing"
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($policyId)) {
          Write-Error "FAIL_CLOSED: policy-id is missing"
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($trustVerdict)) {
          Write-Error "FAIL_CLOSED: trust-verdict is missing"
          exit 1
        }

        if ($authorityUrl -eq 'https://admit.ai-admissibility.com') {
          Write-Error "FAIL_CLOSED: default authority-url is not allowed"
          exit 1
        }
        if ($authorityPubkey -in @('example-pubkey-default','example-pubkey-placeholder')) {
          Write-Error "FAIL_CLOSED: placeholder authority-pubkey is not allowed"
          exit 1
        }
        if ($policyId -in @('example-policy-default','example-policy')) {
          Write-Error "FAIL_CLOSED: placeholder policy-id is not allowed"
          exit 1
        }
        if ($trustVerdict -ne 'PASS') {
          Write-Error "FAIL_CLOSED: trust-verdict must be PASS"
          exit 1
        }

        if ($pilotSmokeOnly -eq 'true') {
          Write-Host "PILOT_SYNTHETIC_SMOKE=PASS"
          Write-Host "NON_CLAIMS=synthetic_evaluation_only_not_live_authority_not_production_not_customer_no_bypass"
          exit 0
        }

        Write-Error "FAIL_CLOSED: runtime authority integration is not wired in this public Action"
        exit 1
